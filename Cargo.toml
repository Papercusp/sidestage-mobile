[workspace]
resolver = "2"
members = [
    "crates/sidestage-core",
    "crates/sidestage-bindings",
    "crates/sidestage-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["SideStage Mobile <avi@storewolf.com>"]
repository = "https://github.com/Papercusp/sidestage-mobile"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
thiserror = "1"
tracing = "0.1"
uniffi = { version = "0.28", features = ["cli"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev]
opt-level = 1
