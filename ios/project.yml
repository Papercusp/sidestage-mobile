# SPDX-License-Identifier: MIT
# XcodeGen specification for the SideStage buyer app.
#
# Run order:
#   1. `make ios` from the repository root (creates SideStageCore.xcframework
#      plus the generated UniFFI Swift source under ios/SideStageCore).
#   2. `xcodegen generate --spec ios/project.yml` from the repository root
#      (creates ios/SideStage.xcodeproj).
#   3. Open ios/SideStage.xcodeproj and run the SideStage scheme.
#
# SideStageCore is the native Swift boundary around the single shared Rust core.
# Keep catalog, realtime, cart, and checkout behavior in sidestage-core rather
# than duplicating it in the SwiftUI application target.

name: SideStage
options:
  bundleIdPrefix: com.sidestage
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: SideStage/Info.plist

configs:
  Debug: debug
  Release: release

# Google's libwebrtc, prebuilt for iOS (the maintained community
# distribution). The WHEP viewer (WI-39800) drives it; everything above the
# engine — signaling, retry policy, copy — is the shared Rust core's (D-036).
# tools/verify-ios-typecheck.sh runs plain swiftc with no SPM resolution, so
# WebRTC-touching Swift is guarded on `canImport(WebRTC)` and this package is
# exercised only by real Xcode builds.
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: 120.0.0

targets:
  SideStageCore:
    type: framework
    platform: iOS
    sources:
      - path: SideStageCore
        excludes:
          - .gitkeep
    dependencies:
      - framework: SideStageCore.xcframework
        embed: false
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidestage.mobile.core
        PRODUCT_MODULE_NAME: SideStageCore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)
        # REQUIRED, not cosmetic. Xcode refuses to code-sign a bundle that has no
        # Info.plist, and it fails at the SIGNING step with a message that names
        # code signing rather than the plist — which reads like a certificate
        # problem on a machine with no signing identity, and sends you hunting for
        # credentials that were never the cause. Simulator builds sign ad-hoc and
        # need no identity; they still need this. Without it:
        #   error: Cannot code sign because the target does not have an Info.plist
        #          file and one is not being generated automatically.
        GENERATE_INFOPLIST_FILE: YES

  SideStage:
    type: application
    platform: iOS
    sources:
      - path: SideStage/Sources
      - path: SideStage/Resources
        optional: true
    dependencies:
      - target: SideStageCore
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidestage.mobile
        PRODUCT_NAME: SideStage
        # Ship a click-and-go demo build. Both Android's emulator and the iOS
        # simulator inside the Mac VM reach the Linux-hosted demo API through
        # the QEMU/Android gateway at 10.0.2.2. Keep this as a build setting so
        # a named Xcode configuration or CI job can still override it.
        SIDESTAGE_API_BASE_URL: "http://10.0.2.2:3100"
        SIDESTAGE_BUYER_ID: "buyer-ff39f82b"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        CODE_SIGN_ENTITLEMENTS: SideStage/SideStage.entitlements

  SideStageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SideStageTests
    dependencies:
      - target: SideStage
      - target: SideStageCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidestage.mobile.tests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SideStage.app/SideStage
        # See the note on SideStageCore — without this the target cannot be signed
        # and `xcodebuild test` dies at BUILD time, so not one test in this bundle
        # ever executes.
        GENERATE_INFOPLIST_FILE: YES

  SideStageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SideStageUITests
    dependencies:
      - target: SideStage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidestage.mobile.uitests
        TEST_TARGET_NAME: SideStage
        # See the note on SideStageCore.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SideStage:
    build:
      targets:
        SideStageCore: all
        SideStage: all
        SideStageTests: [test]
        SideStageUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SideStageTests
        - SideStageUITests
    archive:
      config: Release
