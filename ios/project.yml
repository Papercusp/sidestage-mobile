# SPDX-License-Identifier: MIT
# XcodeGen specification for the SideStage buyer app.
#
# Run order:
#   1. `make ios` from the repository root (creates SideStageCore.xcframework
#      plus the generated UniFFI Swift source under ios/SideStageCore).
#   2. `xcodegen generate --spec ios/project.yml` from the repository root
#      (creates ios/SideStage.xcodeproj).
#   3. Open ios/SideStage.xcodeproj and run the SideStage scheme.
#
# SideStageCore is the native Swift boundary around the single shared Rust core.
# Keep catalog, realtime, cart, and checkout behavior in sidestage-core rather
# than duplicating it in the SwiftUI application target.

name: SideStage
options:
  bundleIdPrefix: com.sidestage
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

configs:
  Debug: debug
  Release: release

targets:
  SideStageCore:
    type: framework
    platform: iOS
    sources:
      - path: SideStageCore
        excludes:
          - .gitkeep
    dependencies:
      - framework: SideStageCore.xcframework
        embed: false
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidestage.mobile.core
        PRODUCT_MODULE_NAME: SideStageCore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)
        # REQUIRED, not cosmetic. Xcode refuses to code-sign a bundle that has no
        # Info.plist, and it fails at the SIGNING step with a message that names
        # code signing rather than the plist — which reads like a certificate
        # problem on a machine with no signing identity, and sends you hunting for
        # credentials that were never the cause. Simulator builds sign ad-hoc and
        # need no identity; they still need this. Without it:
        #   error: Cannot code sign because the target does not have an Info.plist
        #          file and one is not being generated automatically.
        GENERATE_INFOPLIST_FILE: YES

  SideStage:
    type: application
    platform: iOS
    sources:
      - path: SideStage/Sources
      - path: SideStage/Resources
        optional: true
    dependencies:
      - target: SideStageCore
    # Xcode's generated-plist pipeline only accepts a supported subset of
    # INFOPLIST_KEY_* settings; arbitrary app keys are silently dropped. Let
    # XcodeGen materialize the plist into the ignored build directory instead.
    # The custom values still expand from build settings, so CI or a named
    # configuration can override them without editing Swift or this plist.
    info:
      path: build/SideStage-Info.plist
      properties:
        CFBundleDisplayName: SideStage
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        SideStageApiBaseUrl: "$(SIDESTAGE_API_BASE_URL)"
        SideStageBuyerId: "$(SIDESTAGE_BUYER_ID)"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidestage.mobile
        PRODUCT_NAME: SideStage
        # Ship a click-and-go simulator build: localhost inside an iOS
        # simulator is not the Linux host or the public SideStage API. Keep
        # these as build settings so the generated Info.plist above can expand
        # an override supplied by a named Xcode configuration or CI job.
        SIDESTAGE_API_BASE_URL: "https://sidestage.buyrestart.com/api"
        SIDESTAGE_BUYER_ID: "buyer-ff39f82b"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"

  SideStageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SideStageTests
    dependencies:
      - target: SideStage
      - target: SideStageCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidestage.mobile.tests
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SideStage.app/SideStage
        # See the note on SideStageCore — without this the target cannot be signed
        # and `xcodebuild test` dies at BUILD time, so not one test in this bundle
        # ever executes.
        GENERATE_INFOPLIST_FILE: YES

  SideStageUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SideStageUITests
    dependencies:
      - target: SideStage
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sidestage.mobile.uitests
        TEST_TARGET_NAME: SideStage
        # See the note on SideStageCore.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SideStage:
    build:
      targets:
        SideStageCore: all
        SideStage: all
        SideStageTests: [test]
        SideStageUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SideStageTests
        - SideStageUITests
    archive:
      config: Release
